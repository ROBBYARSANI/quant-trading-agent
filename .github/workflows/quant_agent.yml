name: Autonomous Quant Trading Agent & Cloud Dashboard Sync

on:
  schedule:
    # Run every 15 minutes (Dual-Speed Pulse: SL/TP Check + Market Scanner)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: trading-agent-execution
  cancel-in-progress: false

jobs:
  run-trading-agent:
    name: Execute Trading Cycle & Sync Static Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Live Trading Cycle & Scanner
        run: |
          python3 main.py --mode live --once

      - name: Commit & Push State to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html latest_telemetry.json models/*.json models/*.csv models/*.html models/*.joblib || true
          if git diff --staged --quiet; then
            echo "No state or portfolio changes to commit."
          else
            git commit -m "Auto-update portfolio state, models, and dashboard [skip ci]"
            git push
          fi

      - name: Sync Static Dashboard to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: PeopleNw/quant-trading-agent
        run: |
          python3 sync_hf_space.py
